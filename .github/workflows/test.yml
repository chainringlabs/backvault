name: Test

on:
  pull_request:

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests (format fixtures and restore-tool subprocess tests included)
        run: cargo test --workspace --locked

  docker-build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: backvault:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # The runtime is distroless static: no shell, one executable. `--version` is the
        # only path that exits on its own, and it can only succeed if the binary is truly
        # static and runs under Docker's default seccomp profile.
        run: |
          out="$(docker run --rm backvault:test --version)"
          echo "$out"
          case "$out" in backvault\ *) ;; *) echo "unexpected output"; exit 1;; esac
